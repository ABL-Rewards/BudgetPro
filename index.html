<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetPro - Enterprise System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (Untuk Grafik) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.min.js"></script>

    <!-- Fix for Lucide-React UMD bug -->
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/lucide-react@0.260.0/dist/umd/lucide-react.min.js"></script>

    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Ikon Fallback & Loaders
        const FallbackIcon = () => <span className="w-4 h-4 rounded-full bg-slate-300 inline-block animate-pulse"></span>;
        const SafeLucide = window.lucide || window.LucideReact || {};
        const getIcon = (name) => SafeLucide[name] || FallbackIcon;
        
        const LayoutDashboard = getIcon('LayoutDashboard'); const FileText = getIcon('FileText');
        const CalendarDays = getIcon('CalendarDays'); const BarChart3 = getIcon('BarChart3');
        const Settings = getIcon('Settings'); const LogOut = getIcon('LogOut'); const LogIn = getIcon('LogIn');
        const Wallet = getIcon('Wallet'); const TrendingDown = getIcon('TrendingDown');
        const Clock = getIcon('Clock'); const Search = getIcon('Search');
        const Plus = getIcon('Plus'); const AlertCircle = getIcon('AlertCircle'); 
        const CheckCircle2 = getIcon('CheckCircle2'); const Bell = getIcon('Bell');
        const History = getIcon('History'); const Edit3 = getIcon('Edit3'); 
        const ArrowDown = getIcon('ArrowDown'); const ArrowUp = getIcon('ArrowUp'); 
        const UserCircle = getIcon('UserCircle'); const X = getIcon('X'); const Activity = getIcon('Activity');

        // Recharts Components
        const SafeRecharts = window.Recharts || {};
        const BarChart = SafeRecharts.BarChart || 'div'; const Bar = SafeRecharts.Bar || 'div';
        const XAxis = SafeRecharts.XAxis || 'div'; const YAxis = SafeRecharts.YAxis || 'div';
        const CartesianGrid = SafeRecharts.CartesianGrid || 'div'; const RechartsTooltip = SafeRecharts.Tooltip || 'div';
        const ResponsiveContainer = SafeRecharts.ResponsiveContainer || 'div'; const Cell = SafeRecharts.Cell || 'div';

        // =========================================================================
        // URL SCRIPT WAJIB DIISI DI SINI KARENA HTML BERADA DI GITHUB
        // =========================================================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRnhMy0qQpCLrs9EQbyRgwZiyqPjGZSNbpX7cWKaSfYRbJutFfDywcDUL1WBLV72foLw/exec'; 

        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
        const formatB = (num) => {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + ' M';
            if (num >= 1000000) return (num / 1000000).toFixed(0) + ' Jt';
            return num.toString();
        };
        const parseRp = (str) => {
            if (typeof str === 'number') return str;
            if (!str) return 0;
            const cleanStr = String(str).replace(/\./g, '').replace(',', '.');
            return parseFloat(cleanStr) || 0;
        };
        
        const DEPARTMENTS = ['Finance', 'HR', 'IT', 'Operations', 'Marketing', 'Sales', 'Procurement', 'HSE', 'Fleet', 'Offshore', 'General Support (GS)', 'Comben', 'L&D', 'TA', 'CB', 'OD', 'CSR', 'IR'];

        function App() {
            const [users, setUsers] = useState([]);
            const [budgets, setBudgets] = useState([]);
            const [txns, setTxns] = useState([]);
            const [logs, setLogs] = useState([]);
            
            const [isLoading, setIsLoading] = useState(true);
            const [user, setUser] = useState(null);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [fy, setFy] = useState(2026);
            const [filterDept, setFilterDept] = useState('All');
            
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [usageForm, setUsageForm] = useState({ date: new Date().toISOString().split('T')[0], dept: '', code: '', amount: '', desc: '' });

            // 1. MENGAMBIL DATA MENGGUNAKAN FETCH (API CALL)
            useEffect(() => {
                const loadData = async () => {
                    setIsLoading(true);
                    try {
                        if(GOOGLE_SCRIPT_URL === 'PASTE_URL_APPS_SCRIPT_ANDA_DI_SINI') {
                            alert("PENTING: Anda belum memasukkan URL Google Script di baris ke-54 kode HTML!");
                            setIsLoading(false);
                            return;
                        }

                        const response = await fetch(GOOGLE_SCRIPT_URL);
                        const data = await response.json();
                        
                        if(data.users) setUsers(data.users);
                        if(data.budgets) setBudgets(data.budgets);
                        if(data.txns) setTxns(data.txns);
                        if(data.logs) setLogs(data.logs);
                    } catch (error) {
                        console.error("Fetch Error:", error);
                        alert("Gagal terhubung ke Google Sheets. Pastikan URL sudah benar dan akses di-set ke 'Anyone'.");
                    } finally {
                        setIsLoading(false);
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                if (user && user.department !== 'All') setFilterDept(user.department);
            }, [user]);

            // 2. MENGIRIM DATA MENGGUNAKAN FETCH POST
            const postToSheets = (actionType, payload) => {
                // Gunakan mode 'no-cors' dan header 'text/plain' agar tidak diblokir sistem keamanan browser (CORS) saat ditaruh di GitHub
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ actionType, payload })
                }).catch(err => console.error("Error POST:", err));
            };

            const addLog = (action, details, uName = user?.name) => {
                const newLog = { id: Date.now(), time: new Date().toISOString(), user: uName || 'Unknown', action, details };
                setLogs(prev => [newLog, ...prev]);
                postToSheets('ADD_LOG', newLog);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const foundUser = users.find(u => u.username === loginForm.username && String(u.password) === String(loginForm.password));
                if (foundUser) {
                    setUser(foundUser);
                    setShowLoginModal(false);
                    setLoginForm({username: '', password: ''});
                    addLog('LOGIN', 'User logged into the system', foundUser.name);
                } else {
                    alert("Username atau Password salah! (Cek sheet 'Users' di Google Sheets)");
                }
            };

            const handleLogout = () => {
                addLog('LOGOUT', 'User logged out');
                setUser(null);
                setFilterDept('All');
            };

            const handleRollover = () => {
                if (!user) return alert("Harap login untuk melakukan rollover.");
                const nextYear = fy + 1;
                if(!window.confirm(`Sahkan draf FY${nextYear} dan pindahkan sistem aktif ke ${nextYear}?`)) return;

                const updatedBudgets = budgets.map(b => {
                    if (parseInt(b.year) === nextYear) return { ...b, status: 'Approved', Status: 'Approved' };
                    return b;
                });
                
                setBudgets(updatedBudgets);
                setFy(nextYear);
                addLog('SYSTEM_ROLLOVER', `Migrasi sistem disahkan ke FY${nextYear}`);
                postToSheets('ROLLOVER', { nextYear: nextYear });
                setActiveTab('dashboard');
            };

            const activeBudgets = budgets.filter(b => {
                // Membuat filter kebal huruf besar/kecil (Status / status / APPROVED / Approved)
                const bStatus = b.status || b.Status || "";
                return parseInt(b.year) === fy && (filterDept === 'All' || b.dept === filterDept) && bStatus.toLowerCase() === 'approved';
            });
            const activeTxns = txns.filter(t => parseInt(t.year) === fy && (filterDept === 'All' || t.dept === filterDept));

            let mTotalBudget = 0, mTotalSupp = 0, mTotalUsage = 0;
            activeBudgets.forEach(b => mTotalBudget += parseRp(b.amount));
            activeTxns.forEach(t => {
                const amt = parseRp(t.amount);
                if (t.type === 'usage') mTotalUsage += amt;
                if (t.type === 'supplement') mTotalSupp += amt;
            });
            const mTotalAvailable = mTotalBudget + mTotalSupp;
            const mRemaining = mTotalAvailable - mTotalUsage;
            const mUtilPct = mTotalAvailable ? ((mTotalUsage / mTotalAvailable) * 100) : 0;

            const LoginModal = () => {
                if (!showLoginModal) return null;
                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden fade-in">
                            <div className="bg-[#0f172a] p-6 text-center relative border-b border-slate-800">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><X size={20}/></button>
                                <div className="flex justify-center mb-4"><div className="bg-amber-500 p-2.5 rounded-xl shadow-lg"><UserCircle className="text-white" size={28} /></div></div>
                                <h2 className="text-xl font-bold text-white">System Login</h2>
                            </div>
                            <form onSubmit={handleLogin} className="p-6 space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">Username</label>
                                    <input type="text" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="w-full p-2.5 rounded-lg bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-600" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
                                    <input type="password" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full p-2.5 rounded-lg bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-600" required />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg mt-2"><LogIn size={18} className="inline mr-2"/> Sign In</button>
                            </form>
                        </div>
                    </div>
                );
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-[#0f172a] flex flex-col items-center justify-center">
                        <div className="spinner mb-4"></div>
                        <h2 className="text-xl font-bold text-white tracking-widest uppercase">BudgetPro API Sync</h2>
                        <p className="text-slate-400 text-sm mt-2">Menghubungkan Frontend GitHub ke Backend Sheets...</p>
                    </div>
                );
            }

            const Sidebar = () => {
                const navs = [
                    { id: 'dashboard', label: 'Dashboard Analytics', icon: LayoutDashboard },
                    { id: 'detail', label: 'Budget Detail', icon: FileText },
                    { id: 'entry', label: 'Usage Entry', icon: Edit3 },
                    { id: 'planning', label: 'Next Year Planning', icon: CalendarDays },
                    { id: 'logs', label: 'Audit Logs', icon: History }
                ];
                return (
                    <aside className="w-64 bg-[#0f172a] text-slate-300 flex flex-col h-screen fixed left-0 top-0 border-r border-slate-800 z-50">
                        <div className="h-20 flex items-center gap-3 px-6 border-b border-slate-800">
                            <div className="text-amber-500"><BarChart3 size={28} strokeWidth={2.5}/></div>
                            <div>
                                <h1 className="text-xl font-bold text-white">BudgetPro</h1>
                                <p className="text-[10px] font-bold text-slate-500 uppercase">{user ? user.company : 'Guest View'}</p>
                            </div>
                        </div>
                        <nav className="flex-1 py-6 px-4 space-y-1">
                            {navs.map(n => {
                                const active = activeTab === n.id;
                                return (
                                    <button key={n.id} onClick={() => setActiveTab(n.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${active ? 'bg-slate-800 text-amber-500' : 'hover:bg-slate-800/50 hover:text-white'}`}>
                                        <n.icon size={18} className={active ? 'text-amber-500' : 'text-slate-500'} /> {n.label}
                                    </button>
                                )
                            })}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            {user ? (
                                <div>
                                    <div className="flex items-center gap-3 p-3 mb-2 bg-slate-800/50 rounded-xl">
                                        <div className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">{user.name.charAt(0)}</div>
                                        <div className="text-left"><div className="text-xs font-bold text-white truncate w-24">{user.name}</div><div className="text-[10px] text-slate-400 truncate">{user.role}</div></div>
                                    </div>
                                    <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2 text-sm text-slate-400 hover:text-white"><LogOut size={16} /> Logout</button>
                                </div>
                            ) : (
                                <button onClick={() => setShowLoginModal(true)} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md"><LogIn size={18} className="inline mr-2" /> Admin Login</button>
                            )}
                        </div>
                    </aside>
                );
            };

            const TopHeader = ({ title, subtitle }) => (
                <header className="h-24 bg-white border-b border-slate-200 px-8 flex justify-between items-center sticky top-0 z-40">
                    <div>
                        <div className="flex items-center gap-3"><h2 className="text-2xl font-bold text-[#0f172a]">{title}</h2>{!user && <span className="px-2 py-0.5 bg-slate-100 text-slate-500 text-[10px] font-bold rounded border">View Only</span>}</div>
                        <p className="text-sm text-slate-500 mt-1">{subtitle}</p>
                    </div>
                    <div className="flex items-center gap-3 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                        <select value={fy} onChange={e => setFy(parseInt(e.target.value))} className="bg-transparent text-sm font-bold text-slate-700 outline-none cursor-pointer pl-3 py-1">
                            <option value={2026}>FY 2026</option><option value={2027}>FY 2027</option>
                        </select>
                        <div className="w-px h-5 bg-slate-300"></div>
                        <select value={filterDept} onChange={e => setFilterDept(e.target.value)} disabled={user && user.department !== 'All'} className="bg-transparent text-sm font-bold text-slate-700 outline-none cursor-pointer pr-3 py-1">
                            <option value="All">All Departments</option>
                            {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                        </select>
                    </div>
                </header>
            );

            const renderDashboard = () => {
                const kpis = [
                    { title: 'TOTAL BUDGET', val: formatRp(mTotalBudget), bg: 'bg-blue-50', c: 'text-blue-600', icon: Wallet },
                    { title: 'SUPPLEMENT BUDGET', val: formatRp(mTotalSupp), bg: 'bg-emerald-50', c: 'text-emerald-600', icon: Plus },
                    { title: 'TOTAL AVAILABLE', val: formatRp(mTotalAvailable), bg: 'bg-blue-50', c: 'text-blue-600', icon: ArrowDown },
                    { title: 'ACTUAL USAGE', val: formatRp(mTotalUsage), bg: 'bg-purple-50', c: 'text-purple-600', icon: BarChart3 },
                    { title: 'REMAINING BUDGET', val: formatRp(mRemaining), bg: 'bg-amber-50', c: 'text-amber-600', icon: Clock }
                ];
                
                const deptMap = {};
                activeBudgets.forEach(b => { if(!deptMap[b.dept]) deptMap[b.dept] = { name: b.dept, budget: 0, usage: 0 }; deptMap[b.dept].budget += parseRp(b.amount); });
                activeTxns.forEach(t => {
                    const amt = parseRp(t.amount);
                    if(t.type === 'supplement' && deptMap[t.dept]) deptMap[t.dept].budget += amt;
                    if(t.type === 'usage' && deptMap[t.dept]) deptMap[t.dept].usage += amt;
                });
                const deptData = Object.values(deptMap).map(d => ({ ...d, pct: d.budget ? Math.round((d.usage/d.budget)*100) : 0 })).sort((a,b) => b.pct - a.pct);
                
                const chartData = [
                    { name: 'Initial', val: mTotalBudget, fill: '#1e3a8a' }, { name: 'Supplement', val: mTotalSupp, fill: '#10b981' },
                    { name: 'Revised', val: mTotalAvailable, fill: '#3b82f6' }, { name: 'Actual', val: mTotalUsage, fill: '#8b5cf6' },
                    { name: 'Remaining', val: mRemaining, fill: '#f59e0b' }
                ];

                return (
                    <div className="p-8 space-y-6 fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                            {kpis.map((k, i) => (
                                <div key={i} className="bg-white p-5 rounded-2xl border border-slate-200">
                                    <div className="flex gap-4 items-center mb-4"><div className={`p-3 rounded-xl ${k.bg} ${k.c}`}><k.icon size={22}/></div><div><h4 className="text-[10px] font-bold text-slate-500 uppercase">{k.title}</h4><h2 className="text-lg font-black text-[#0f172a] mt-0.5">{k.val.split(',00')[0].length > 13 ? formatB(parseFloat(k.val.replace(/[^0-9]/g,''))) : k.val.split(',00')[0]}</h2></div></div>
                                </div>
                            ))}
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 col-span-2 flex flex-col">
                                <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-[#0f172a]">Budget Variance Analysis</h3></div>
                                <div className="h-72 w-full relative">
                                    {mTotalBudget === 0 ? (<div className="absolute inset-0 flex items-center justify-center text-slate-400">Data Kosong</div>) : (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={chartData} margin={{top:20}}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0"/>
                                                <XAxis dataKey="name" tick={{fontSize: 11}} axisLine={false} tickLine={false} />
                                                <YAxis tickFormatter={formatB} tick={{fontSize: 11}} axisLine={false} tickLine={false} />
                                                <RechartsTooltip formatter={(val) => formatRp(val)} />
                                                <Bar dataKey="val" radius={[4,4,0,0]} barSize={40}>{chartData.map((e, i) => <Cell key={i} fill={e.fill}/>)}</Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    )}
                                </div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl border border-slate-200">
                                <h3 className="font-bold text-[#0f172a] mb-6">Ranking Dept (Utilization)</h3>
                                <div className="space-y-5">
                                    {deptData.slice(0,6).map((d, i) => (
                                        <div key={i}>
                                            <div className="flex justify-between items-center mb-1.5"><span className="text-sm font-bold text-slate-700">{i+1}. {d.name}</span><span className="text-sm font-bold">{d.pct}%</span></div>
                                            <div className="w-full bg-slate-100 rounded-full h-2"><div className={`h-2 rounded-full ${d.pct > 80 ? 'bg-red-500' : 'bg-emerald-500'}`} style={{width: `${Math.min(d.pct, 100)}%`}}></div></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderBudgetDetail = () => {
                const glData = [];
                activeBudgets.forEach(b => {
                    const amt = parseRp(b.amount);
                    let supp = 0, usg = 0;
                    activeTxns.forEach(t => { if(t.code === b.code && t.dept === b.dept) { if(t.type === 'supplement') supp += parseRp(t.amount); if(t.type === 'usage') usg += parseRp(t.amount); }});
                    const revised = amt + supp; const rem = revised - usg; const pct = revised ? Math.round((usg/revised)*100) : 0;
                    glData.push({ dept: b.dept, code: b.code, name: b.name, approved: amt, supp: supp, revised: revised, usage: usg, rem: rem, pct: pct });
                });

                return (
                    <div className="p-8 space-y-6 fade-in">
                        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                            <div className="p-5 border-b border-slate-100 bg-slate-50"><h3 className="font-bold">Breakdown per GL Code (FY{fy})</h3></div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-white border-b border-slate-200 text-slate-500 text-[11px] uppercase">
                                        <tr><th className="px-6 py-4">GL Code & Name</th><th className="px-6 py-4 text-right">Approved</th><th className="px-6 py-4 text-right">Revised Budget</th><th className="px-6 py-4 text-right">Actual Usage</th><th className="px-6 py-4 text-right">Remaining</th><th className="px-6 py-4 text-center">Utilization</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {glData.map((g, i) => (
                                            <tr key={i} className="hover:bg-slate-50/80">
                                                <td className="px-6 py-4"><div className="font-bold text-blue-600">{g.code}</div><div className="text-xs text-slate-500">{g.name}</div></td>
                                                <td className="px-6 py-4 text-right text-slate-500">{formatRp(g.approved)}</td>
                                                <td className="px-6 py-4 text-right font-bold">{formatRp(g.revised)}</td>
                                                <td className="px-6 py-4 text-right font-bold text-purple-600">{formatRp(g.usage)}</td>
                                                <td className="px-6 py-4 text-right font-bold text-amber-600">{formatRp(g.rem)}</td>
                                                <td className="px-6 py-4 text-center"><span className="text-xs font-bold w-8">{g.pct}%</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                )
            };

            const renderUsageEntry = () => {
                const handleSaveUsage = (e) => {
                    e.preventDefault();
                    if(!user) return alert("Hanya user terdaftar yang dapat menginput transaksi!");
                    const amt = parseRp(usageForm.amount);
                    if(amt <= 0) return alert("Amount must be > 0");
                    const newTxn = { id: `T${Date.now()}`, date: usageForm.date, year: fy, dept: usageForm.dept, code: usageForm.code, type: 'usage', amount: amt, desc: usageForm.desc, by: user.name };
                    setTxns([newTxn, ...txns]); addLog('INPUT_USAGE', `Recorded Usage Rp ${formatRp(amt)} for GL ${usageForm.code}`);
                    postToSheets('ADD_TXN', newTxn); setUsageForm({...usageForm, amount: '', desc: ''});
                };
                
                const selBudget = activeBudgets.find(b => b.code === usageForm.code && b.dept === usageForm.dept);
                let gBudget = selBudget ? parseRp(selBudget.amount) : 0; let gUsage = 0;
                activeTxns.forEach(t => { if(t.code === usageForm.code && t.dept === usageForm.dept) { const amt = parseRp(t.amount); if(t.type === 'usage') gUsage += amt; if(t.type === 'supplement') gBudget += amt; }});
                const inputAmt = parseRp(usageForm.amount); const rem = gBudget - gUsage - inputAmt; const isOver = rem < 0;

                return (
                    <div className="p-8 space-y-6 fade-in">
                        {!user && (<div className="bg-amber-50 text-amber-800 p-4 rounded-xl flex items-center gap-3"><AlertCircle size={20}/><strong>Mode Guest Aktif</strong> (Input dikunci)</div>)}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className={`lg:col-span-2 bg-white rounded-2xl border border-slate-200 ${!user ? 'opacity-70 pointer-events-none' : ''}`}>
                                <div className="p-5 border-b border-slate-100 bg-slate-50"><h3 className="font-bold">Input Usage</h3></div>
                                <form onSubmit={handleSaveUsage} className="p-6 grid grid-cols-2 gap-6">
                                    <div><label className="block text-xs font-bold mb-2">Tanggal *</label><input type="date" value={usageForm.date} onChange={e=>setUsageForm({...usageForm, date: e.target.value})} className="w-full p-3 border rounded-xl" required/></div>
                                    <div><label className="block text-xs font-bold mb-2">Department *</label><select value={usageForm.dept} onChange={e=>setUsageForm({...usageForm, dept: e.target.value})} className="w-full p-3 border rounded-xl" required disabled={user && user.department !== 'All'}><option value="">Pilih Dept</option>{DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}</select></div>
                                    <div className="col-span-2"><label className="block text-xs font-bold mb-2">GL Code *</label><select value={usageForm.code} onChange={e=>setUsageForm({...usageForm, code: e.target.value})} className="w-full p-3 border rounded-xl" required><option value="">Select GL Code</option>{activeBudgets.filter(b=>b.dept === usageForm.dept).map(b => <option key={b.code} value={b.code}>{b.code} - {b.name}</option>)}</select></div>
                                    <div><label className="block text-xs font-bold mb-2">Keterangan *</label><input type="text" value={usageForm.desc} onChange={e=>setUsageForm({...usageForm, desc: e.target.value})} className="w-full p-3 border rounded-xl" required /></div>
                                    <div><label className="block text-xs font-bold mb-2">Amount (Rp) *</label><input type="text" value={usageForm.amount} onChange={e => { let val = e.target.value.replace(/[^0-9]/g, ''); val = val.replace(/\B(?=(\d{3})+(?!\d))/g, "."); setUsageForm({...usageForm, amount: val}); }} className="w-full p-3 border rounded-xl font-bold" required/></div>
                                    <div className="col-span-2 flex justify-end mt-2"><button type="submit" className="px-8 py-3 bg-amber-500 text-white font-bold rounded-xl"><Edit3 size={16} className="inline mr-2"/> Save Usage</button></div>
                                </form>
                            </div>
                            <div className="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col">
                                <h3 className="font-bold flex items-center gap-2 mb-6"><CheckCircle2 className="text-blue-600" size={20}/> Budget Checking</h3>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center pb-4 border-b"><div className="text-sm font-bold text-slate-600">Budget Available</div><div className="text-lg font-black">{formatRp(gBudget - gUsage)}</div></div>
                                    <div className="flex justify-between items-center pb-4 border-b"><div className="text-sm font-bold text-slate-600">Input Usage</div><div className="text-lg font-black text-amber-600">{formatRp(inputAmt)}</div></div>
                                    <div className="flex justify-between items-center pt-2"><div className="text-sm font-bold text-slate-600">Remaining</div><div className={`text-xl font-black ${isOver ? 'text-red-500' : 'text-emerald-500'}`}>{formatRp(rem)}</div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderPlanning = () => {
                const nextYear = fy + 1;
                const drafts = budgets.filter(b => parseInt(b.year) === nextYear && (filterDept === 'All' || b.dept === filterDept));
                
                return (
                    <div className="p-8 space-y-6 fade-in">
                        <div className="bg-[#0f172a] rounded-3xl p-10 flex justify-between items-center shadow-lg relative overflow-hidden">
                            <div className="relative z-10 text-white"><h2 className="text-2xl font-black mb-2 flex items-center gap-3"><CalendarDays className="text-amber-500"/> Next Year Planning - FY{nextYear}</h2><p className="text-slate-400 text-sm">Monitor budget proposals for the upcoming fiscal year.</p></div>
                            <div className="relative z-10"><button onClick={handleRollover} disabled={!user || drafts.length === 0} className={`px-6 py-3.5 font-bold rounded-xl ${user && drafts.length > 0 ? 'bg-amber-500 text-white' : 'bg-slate-800 text-slate-500'}`}><CheckCircle2 size={18} className="inline mr-2"/> Approve & Rollover</button></div>
                        </div>
                        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                            <div className="p-5 border-b border-slate-100 bg-slate-50"><h3 className="font-bold">Draft Proposals (FY{nextYear})</h3></div>
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 border-b text-[11px] uppercase"><tr><th className="px-6 py-4">Department & GL Code</th><th className="px-6 py-4 text-right">FY{fy} Budget</th><th className="px-6 py-4 text-right text-blue-600">Proposed FY{nextYear}</th><th className="px-6 py-4 text-center">Status</th></tr></thead>
                                <tbody>
                                    {drafts.map(d => {
                                        const curr = budgets.find(b => b.code === d.code && b.dept === d.dept && parseInt(b.year) === fy);
                                        const currAmt = curr ? parseRp(curr.amount) : 0; const dAmt = parseRp(d.amount); const diff = dAmt - currAmt; const pct = currAmt ? (diff/currAmt)*100 : 0;
                                        return (
                                            <tr key={d.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                <td className="px-6 py-5"><div className="font-bold">{d.code} - {d.dept}</div><div className="text-xs text-slate-500">{d.name}</div></td>
                                                <td className="px-6 py-5 text-right">{formatRp(currAmt)}</td>
                                                <td className="px-6 py-5 text-right bg-blue-50/30"><div className="font-black text-lg">{formatRp(dAmt)}</div>{currAmt > 0 && (<div className={`text-[11px] font-bold ${diff > 0 ? 'text-red-500' : 'text-emerald-500'}`}>{diff > 0 ? '+' : ''}{pct.toFixed(1)}% vs FY{fy}</div>)}</td>
                                                <td className="px-6 py-5 text-center"><span className="px-3 py-1 bg-slate-100 text-[10px] font-bold uppercase rounded">{d.status || d.Status}</span></td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const renderLogs = () => (
                <div className="p-8 space-y-6 fade-in">
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="p-5 border-b border-slate-100 bg-slate-50"><h3 className="font-bold flex items-center gap-2"><History size={18} className="text-blue-600"/> System Audit Trail</h3></div>
                        <table className="w-full text-left text-sm">
                            <thead className="border-b text-[10px] uppercase"><tr><th className="px-6 py-4">Timestamp</th><th className="px-6 py-4">User</th><th className="px-6 py-4">Action</th><th className="px-6 py-4">Details</th></tr></thead>
                            <tbody className="divide-y divide-slate-100">
                                {logs.map((log) => (
                                    <tr key={log.id} className="hover:bg-slate-50">
                                        <td className="px-6 py-4 font-medium">{new Date(log.time).toLocaleString('id-ID')}</td>
                                        <td className="px-6 py-4 font-bold">{log.user}</td>
                                        <td className="px-6 py-4"><span className="bg-blue-50 px-2.5 py-1 rounded text-[10px] font-bold text-blue-700">{log.action}</span></td>
                                        <td className="px-6 py-4 text-slate-600">{log.details}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen bg-[#f8fafc] overflow-hidden">
                    <Sidebar />
                    <div className="flex-1 ml-64 flex flex-col h-screen">
                        <TopHeader title={{dashboard:'Dashboard Analytics', detail:'Budget Detail', entry:`Usage Entry (FY${fy})`, planning:`Next Year Planning (FY${fy + 1})`, logs:'Audit Logs'}[activeTab]} subtitle="Enterprise Budget Management" />
                        <main className="flex-1 overflow-y-auto">
                            <div className="max-w-[1600px] mx-auto min-h-full">
                                {activeTab === 'dashboard' && renderDashboard()} {activeTab === 'detail' && renderBudgetDetail()}
                                {activeTab === 'entry' && renderUsageEntry()} {activeTab === 'planning' && renderPlanning()}
                                {activeTab === 'logs' && renderLogs()}
                            </div>
                        </main>
                    </div>
                    <LoginModal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

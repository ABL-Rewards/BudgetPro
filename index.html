<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetPro - Enterprise</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.7.2/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.1.9/Recharts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .toast-enter { animation: toastSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes toastSlide { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // JIKA PAKAI GITHUB: Taruh URL Web App Anda di sini
        // JIKA PAKAI LINK APPS SCRIPT LANGSUNG: Biarkan saja, sistem akan otomatis membaca datanya.
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRnhMy0qQpCLrs9EQbyRgwZiyqPjGZSNbpX7cWKaSfYRbJutFfDywcDUL1WBLV72foLw/exec'; 

        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, Cell, Legend } = window.Recharts;

        class ContentErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidUpdate(prevProps) { if (this.props.activeTab !== prevProps.activeTab) this.setState({ hasError: false, error: null }); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 bg-red-50 border border-red-200 rounded-xl m-8">
                            <h2 className="text-lg font-bold text-red-600 mb-2">⚠️ Error Executing Component</h2>
                            <pre className="text-xs bg-slate-900 text-green-400 p-4 rounded overflow-auto max-h-64 whitespace-pre-wrap">{this.state.error ? this.state.error.toString() : 'Unknown Error'}</pre>
                            <button onClick={() => window.location.reload()} className="mt-4 px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded font-bold">Reload Application</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const App = () => {
            const [isLoading, setIsLoading] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false); 
            const [data, setData] = useState({ users: [], departments: [], companies: [], budgets: [], transactions: [], rates: {}, logoUrl: '' });
            const [user, setUser] = useState(null);
            
            const [loginInput, setLoginInput] = useState({ user: '', pass: '' });
            const [loginError, setLoginError] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [currency, setCurrency] = useState('IDR');
            const [subDept, setSubDept] = useState('');
            const [activeCompany, setActiveCompany] = useState('All');
            const [activeYear, setActiveYear] = useState('2026');
            const [toast, setToast] = useState(null);

            const [filterBudgetGL, setFilterBudgetGL] = useState('ALL');
            const [filterBudgetComp, setFilterBudgetComp] = useState('ALL');
            const [searchBudgetDesc, setSearchBudgetDesc] = useState('');
            
            const [filterUsageGL, setFilterUsageGL] = useState('ALL');
            const [filterUsageComp, setFilterUsageComp] = useState('ALL');
            const [searchUsageDesc, setSearchUsageDesc] = useState('');
            
            const [searchSuppDesc, setSearchSuppDesc] = useState('');
            
            const [usageForm, setUsageForm] = useState({ date:'', company:'', dept:'', gl:'', amount:'', desc:'' });
            const [suppForm, setSuppForm] = useState({ date:'', company:'', dept:'', gl:'', amount:'', desc:'' });
            const [adminForm, setAdminForm] = useState({ type:'Company', value:'' });
            const [userForm, setUserForm] = useState({ username:'', password:'', name:'', role:'User', dept:'', comp:'', email:'' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [detailModal, setDetailModal] = useState(null);
            const [editingDraft, setEditingDraft] = useState(null); 
            const [draftInput, setDraftInput] = useState('');
            const [reportCompany, setReportCompany] = useState('All');

            // API GITHUB (Jika dipakai di luar Google)
            const apiCall = async (action, payload = {}) => {
                const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, data: payload }) });
                return await res.json();
            };

            const fetchData = (isBackground = false) => {
                if (!isBackground) setIsLoading(true); else setIsSyncing(true);

                // LOGIKA 1: JIKA DIBUKA DI APPS SCRIPT LANGSUNG (Paling Lancar)
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if(res.error) { if(!isBackground) setLoginError(res.error); else showToast(res.error, 'error'); } 
                            else { setData({ users: res.users||[], departments: res.departments||[], companies: res.companies||[], budgets: res.budgets||[], transactions: res.transactions||[], rates: res.rates||{}, logoUrl: res.logoUrl||'' }); if (!isBackground) setLoginError(''); }
                            setIsLoading(false); setIsSyncing(false);
                        })
                        .withFailureHandler((err) => { if (!isBackground) setLoginError(err.toString()); setIsLoading(false); setIsSyncing(false); })
                        .getAppData();
                } 
                // LOGIKA 2: JIKA DIBUKA DI GITHUB (Maka Pakai URL)
                else if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                    apiCall('getAppData').then((res) => {
                        if(res.error) { if(!isBackground) setLoginError(res.error); else showToast(res.error, 'error'); } 
                        else { setData({ users: res.users||[], departments: res.departments||[], companies: res.companies||[], budgets: res.budgets||[], transactions: res.transactions||[], rates: res.rates||{}, logoUrl: res.logoUrl||'' }); if (!isBackground) setLoginError(''); }
                        setIsLoading(false); setIsSyncing(false);
                    }).catch((err) => { if (!isBackground) setLoginError(err.toString()); setIsLoading(false); setIsSyncing(false); });
                } 
                // LOGIKA 3: DEMO MODE JIKA DI PREVIEW
                else {
                    if (!isBackground) setLoginError("✅ Demo Mode Aktif. Login -> User: admin | Pass: 123"); 
                    setTimeout(() => {
                        setData({
                            rates: { "2026": 16500, "2027": 18000 },
                            logoUrl: "https://i.ibb.co.com/d4J7SpwB/logo-tranparant-BP-tulisan.png",
                            users: [{ id: '1', username: 'admin', password: '123', name: 'Admin Demo', role: 'Super Admin', department: 'All', company: 'All' }],
                            departments: ['HCGS', 'Finance'], companies: ['ABL', 'DCA'],
                            budgets: [
                                { id: 'b1', year: '2026', company: 'ABL', department: 'HCGS', gl_code: '5200', gl_name: 'Training', amount_idr: 150000000, amount_usd: 10000, status: 'Approved', description: 'Pelatihan Tahunan' }
                            ],
                            transactions: [
                                { id: 't1', date: '2026-03-10', year: '2026', company: 'ABL', department: 'HCGS', gl_code: '5200', gl_name: 'Training', type: 'usage_manual', amount_idr: 25000000, amount_usd: 1600, description: 'Leadership Training', by: 'Admin Demo' }
                            ]
                        });
                        setIsLoading(false); setIsSyncing(false);
                    }, 600);
                }
            };

            useEffect(() => { fetchData(false); }, []);

            const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 4000); };
            const safeNum = (val) => parseFloat(val) || 0;
            const formatUang = (num) => new Intl.NumberFormat(currency === 'IDR' ? 'id-ID' : 'en-US', { style: 'currency', currency: currency, maximumFractionDigits: 0 }).format(safeNum(num));
            const formatShort = (num) => { const n = safeNum(num); if (Math.abs(n) >= 1000000000) return (n / 1000000000).toFixed(1) + 'B'; if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(1) + 'M'; return n.toString(); };

            const downloadCSV = (dataList, filename) => {
                if(!dataList || dataList.length === 0) return showToast("No data to download", "error");
                const headers = Object.keys(dataList[0]).join(",");
                const rows = dataList.map(row => Object.values(row).map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
                const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri); link.setAttribute("download", `${filename}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            if (isLoading) return <div className="flex flex-col h-screen w-full items-center justify-center bg-slate-50"><div className="loader mb-4"></div><p className="text-sm font-bold text-blue-600 uppercase">Syncing Database...</p></div>;
            
            if (!user) {
                const handleLogin = (e) => {
                    e.preventDefault();
                    const matchedUser = data.users.find(u => String(u.username) === String(loginInput.user) && String(u.password) === String(loginInput.pass));
                    if (matchedUser) {
                        setUser(matchedUser);
                        let uDept = matchedUser.department;
                        const canChangeDept = !uDept || uDept === 'All' || uDept === 'All Area HCGS';
                        if (canChangeDept) { setSubDept('All Area HCGS'); setSuppForm(p => ({...p, dept: ''})); setUsageForm(p => ({...p, dept: ''})); } 
                        else { setSubDept(uDept); setSuppForm(p => ({...p, dept: uDept})); setUsageForm(p => ({...p, dept: uDept})); }

                        let uComp = matchedUser.company;
                        const canChangeComp = !uComp || String(uComp).toLowerCase() === 'all' || String(uComp).toLowerCase() === 'all companies';
                        if (canChangeComp) setActiveCompany('All'); else setActiveCompany(uComp);
                    } else setLoginError('Invalid Username or Password');
                };
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-slate-100 p-4">
                        <div className="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
                            <div className="flex justify-center mb-6"><img src={data.logoUrl || "https://i.ibb.co.com/d4J7SpwB/logo-tranparant-BP-tulisan.png"} alt="Logo" className="h-16 object-contain" /></div>
                            {loginError && <div className="p-3 rounded-lg text-xs mb-6 font-semibold bg-blue-50 text-blue-700 border border-blue-200 text-center">{loginError}</div>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div><label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Username</label><input type="text" required value={loginInput.user} onChange={e => setLoginInput({...loginInput, user: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm outline-none focus:border-blue-500" /></div>
                                <div><label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Password</label><input type="password" required value={loginInput.pass} onChange={e => setLoginInput({...loginInput, pass: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm outline-none focus:border-blue-500" /></div>
                                <button type="submit" className="w-full text-white font-bold py-3 rounded-lg mt-4 shadow-lg bg-blue-600 hover:bg-blue-700">Enter System</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const userRoleStr = String(user.role).toLowerCase();
            const isAdmin = userRoleStr === 'admin' || userRoleStr === 'super admin';
            const isUserLocked = user.department !== 'All' && user.department !== 'All Area HCGS';
            const isCompLocked = user.company && String(user.company).toLowerCase() !== 'all' && String(user.company).toLowerCase() !== 'all companies';

            const activeBudgets = (data.budgets || []).filter(b => 
                String(b.year).trim() === String(activeYear).trim() && 
                String(b.status).trim().toLowerCase() !== 'draft' && 
                (subDept === 'All Area HCGS' || String(b.department).trim() === subDept) &&
                (activeCompany === 'All' || String(b.company).trim() === activeCompany)
            );
            
            const activeTxns = (data.transactions || []).filter(t => 
                String(t.year).trim() === String(activeYear).trim() && 
                (subDept === 'All Area HCGS' || String(t.department).trim() === subDept) &&
                (activeCompany === 'All' || String(t.company).trim() === activeCompany)
            );

            let tBudget = 0, tUsage = 0, tSupp = 0;
            activeBudgets.forEach(b => { tBudget += (currency === 'IDR' ? safeNum(b.amount_idr) : safeNum(b.amount_usd)); });
            activeTxns.forEach(t => { 
                const amt = (currency === 'IDR' ? safeNum(t.amount_idr) : safeNum(t.amount_usd));
                if(String(t.type).toLowerCase() === 'supplement') tSupp += amt;
                else tUsage += amt; 
            });
            const tRevised = tBudget + tSupp;
            const remaining = tRevised - tUsage;
            const utilPct = tRevised > 0 ? (tUsage/tRevised)*100 : 0;

            const renderDashboard = () => {
                const glSummary = {};
                activeBudgets.forEach(b => {
                    const key = `${b.company}-${b.gl_code}`;
                    if(!glSummary[key]) glSummary[key] = { name: b.gl_name, code: b.gl_code, comp: b.company, initial: 0, supp: 0, usage: 0 };
                    glSummary[key].initial += (currency === 'IDR' ? safeNum(b.amount_idr) : safeNum(b.amount_usd));
                });
                activeTxns.forEach(t => {
                    const key = `${t.company}-${t.gl_code}`;
                    if(glSummary[key]) {
                        const amt = (currency === 'IDR' ? safeNum(t.amount_idr) : safeNum(t.amount_usd));
                        if(String(t.type).toLowerCase() === 'supplement') glSummary[key].supp += amt;
                        else glSummary[key].usage += amt;
                    }
                });
                
                const utilWarnings = Object.values(glSummary).map(g => {
                    const revised = g.initial + g.supp;
                    const pct = revised > 0 ? (g.usage / revised) * 100 : 0;
                    return { ...g, revised, pct };
                }).filter(g => g.pct >= 75).sort((a,b) => b.pct - a.pct);

                return (
                    <div className="space-y-6 fade-in pb-10">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200"><p className="text-[10px] font-bold text-slate-500 uppercase">Initial Budget</p><h2 className="text-xl font-black text-blue-700 mt-1">{formatUang(tBudget)}</h2></div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200"><p className="text-[10px] font-bold text-slate-500 uppercase flex justify-between">Supplementary <span>{tBudget?((tSupp/tBudget)*100).toFixed(1):0}%</span></p><h2 className="text-xl font-black text-emerald-600 mt-1">{(tSupp>0?'+':'')}{formatUang(tSupp)}</h2></div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200"><p className="text-[10px] font-bold text-slate-500 uppercase flex justify-between">Actual Usage <span>{utilPct.toFixed(1)}%</span></p><h2 className="text-xl font-black text-purple-700 mt-1">{formatUang(tUsage)}</h2></div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 border-b-4 border-b-amber-500"><p className="text-[10px] font-bold text-slate-500 uppercase">Remaining Available</p><h2 className="text-xl font-black text-amber-500 mt-1">{formatUang(remaining)}</h2></div>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 col-span-2 h-[400px] flex flex-col">
                                <h3 className="font-bold text-slate-800 mb-6">Budget Variance Analysis ({currency})</h3>
                                <div className="flex-1 w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={[ { name: 'Initial', val: tBudget, fill: '#1d4ed8' }, { name: 'Supplement', val: tSupp, fill: '#10b981' }, { name: 'Usage', val: tUsage, fill: '#7e22ce' }, { name: 'Remaining', val: remaining, fill: '#f59e0b' } ]}><CartesianGrid strokeDasharray="3 3" vertical={false}/><XAxis dataKey="name" tick={{fontSize: 12}} axisLine={false} tickLine={false}/><YAxis tickFormatter={formatShort} tick={{fontSize: 12}} axisLine={false} tickLine={false} /><RechartsTooltip formatter={(val) => formatUang(val)} /><Bar dataKey="val" radius={[6,6,0,0]} barSize={60}>{['#1d4ed8', '#10b981', '#7e22ce', '#f59e0b'].map((c, i) => <Cell key={i} fill={c}/>)}</Bar></BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[400px]">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center justify-between">Early Warning System <span className="bg-red-100 text-red-600 text-[10px] px-2 py-0.5 rounded-full">&gt;75% Utilized</span></h3>
                                <div className="flex-1 overflow-y-auto space-y-4 pr-2">
                                    {utilWarnings.length === 0 ? <p className="text-xs text-slate-400">All budgets safe (&lt;75%).</p> : utilWarnings.map((w, i) => (
                                        <div key={i} className="border-b border-slate-100 pb-3">
                                            <div className="flex justify-between text-xs font-bold mb-1"><span className="text-slate-800 truncate max-w-[150px]" title={w.name}>[{w.comp}] {w.name}</span><span className="text-red-600">{w.pct.toFixed(1)}%</span></div>
                                            <div className="w-full bg-slate-100 h-1.5 rounded-full mb-1"><div className="h-1.5 rounded-full bg-red-500" style={{width: `${Math.min(w.pct, 100)}%`}}></div></div>
                                            <div className="flex justify-between text-[10px] text-slate-500"><span>Rem: {formatUang(w.revised - w.usage)}</span><button onClick={()=>setActiveTab('supplement')} className="text-blue-600 font-bold hover:underline">Needs Supp!</button></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderBudgetTable = () => {
                const aggData = {};
                activeBudgets.forEach(b => {
                    const desc = b.description ? String(b.description).trim() : '-';
                    const key = `${b.company}-${b.department}-${b.gl_code}-${desc.toLowerCase()}`;
                    if(!aggData[key]) aggData[key] = { ...b, description: desc, initial:0, supp:0, usage:0, all_desc: new Set(), all_names: new Set() };
                    aggData[key].initial += (currency === 'IDR' ? safeNum(b.amount_idr) : safeNum(b.amount_usd));
                    if(b.description && String(b.description).trim() !== '-' && String(b.description).trim() !== '') aggData[key].all_desc.add(String(b.description).trim());
                    if(b.gl_name && String(b.gl_name).trim() !== '-' && String(b.gl_name).trim() !== '') aggData[key].all_names.add(String(b.gl_name).trim());
                });
                
                activeTxns.forEach(t => {
                    const desc = t.description ? String(t.description).trim() : '-';
                    const key = `${t.company}-${t.department}-${t.gl_code}-${desc.toLowerCase()}`;
                    if(!aggData[key]) aggData[key] = { company: t.company, department: t.department, gl_code: t.gl_code, gl_name: t.gl_name, description: desc, initial: 0, supp: 0, usage: 0, all_desc: new Set([desc]), all_names: new Set([t.gl_name]) };
                    const amt = (currency === 'IDR' ? safeNum(t.amount_idr) : safeNum(t.amount_usd));
                    if(String(t.type).toLowerCase() === 'supplement') aggData[key].supp += amt; else aggData[key].usage += amt;
                });

                const uniqueGLs = []; const glMap = new Map();
                const uniqueComps = []; const compMap = new Set();
                
                Object.values(aggData).forEach(b => {
                    if(!glMap.has(b.gl_code)) { glMap.set(b.gl_code, Array.from(b.all_names)[0] || b.gl_name); uniqueGLs.push({ code: b.gl_code, name: Array.from(b.all_names)[0] || b.gl_name }); }
                    if(!compMap.has(b.company)) { compMap.add(b.company); uniqueComps.push(b.company); }
                });

                const filtered = Object.values(aggData).filter(item => 
                    (filterBudgetGL === 'ALL' || item.gl_code === filterBudgetGL) &&
                    (filterBudgetComp === 'ALL' || item.company === filterBudgetComp) &&
                    (searchBudgetDesc === '' || (item.description && item.description.toLowerCase().includes(searchBudgetDesc.toLowerCase())))
                );

                return (
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full fade-in">
                        <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-slate-800 text-sm">Master Budget Breakdown</h3>
                            <div className="flex space-x-2">
                                <label className="cursor-pointer px-3 py-1 bg-white border border-slate-300 text-slate-700 rounded text-xs font-bold hover:bg-slate-50 flex items-center">
                                    <input type="file" className="hidden" accept=".csv" onChange={()=>showToast("Sistem Upload CSV sedang disiapkan", "warning")} />
                                    <span>📤 Upload CSV</span>
                                </label>
                                <button onClick={() => {
                                    const exportData = filtered.map(r => ({
                                        'Comp': r.company, 'Dept': r.department, 'GL Code': r.gl_code, 'GL Name': r.gl_name, 'Desc': r.description || '-',
                                        'Initial Budget': r.initial, 'Supplement': r.supp, 'Usage': r.usage, 'Remaining': (r.initial + r.supp) - r.usage
                                    })); downloadCSV(exportData, "Budget_Confirm");
                                }} className="px-3 py-1 bg-slate-800 text-white rounded text-xs font-bold hover:bg-slate-700">📥 Download CSV</button>
                            </div>
                        </div>
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-left text-xs whitespace-nowrap">
                                <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase sticky top-0 shadow-sm z-10">
                                    <tr>
                                        <th className="px-4 py-3 align-top"><div className="mb-1 text-[10px]">Filter Comp</div><select value={filterBudgetComp} onChange={e=>setFilterBudgetComp(e.target.value)} className="w-full border border-slate-300 rounded p-1 text-slate-800 font-normal outline-none focus:border-blue-500 max-w-[120px] cursor-pointer bg-slate-50"><option value="ALL">- All -</option>{uniqueComps.sort().map(c => <option key={c} value={c}>{c}</option>)}</select></th>
                                        <th className="px-4 py-3 align-top">Dept</th>

                                        <th className="px-4 py-3 text-right align-top">Initial</th><th className="px-4 py-3 text-right text-emerald-600 align-top">Supplement</th><th className="px-4 py-3 text-right text-purple-600 align-top">Usage</th><th className="px-4 py-3 text-right align-top">Remaining</th>

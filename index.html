                                        const rem = (r.initial + r.supp) - r.usage;
                                        const combinedDesc = Array.from(r.all_desc).join(' | ');
                                        const combinedNames = Array.from(r.all_names).join(' | ');
                                        return (
                                            <tr key={i} className="hover:bg-slate-50">
                                                <td className="px-4 py-3 font-bold text-slate-700">{r.company}</td><td className="px-4 py-3">{r.department}</td>
                                                <td className="px-4 py-3"><div className="font-bold text-blue-700">{r.gl_code}</div><div className="text-[10px] text-slate-500 max-w-[200px] whitespace-normal break-words">{combinedNames || r.gl_name}</div></td>
                                                <td className="px-4 py-3 whitespace-normal break-words max-w-[300px]">{combinedDesc || r.description || '-'}</td>
                                                <td className="px-4 py-3 text-right font-semibold">{formatUang(r.initial)}</td>
                                                <td className="px-4 py-3 text-right font-bold text-emerald-600">{r.supp!==0?formatUang(r.supp):'-'}</td>
                                                <td className="px-4 py-3 text-right font-bold text-purple-700">{r.usage!==0?formatUang(r.usage):'-'}</td>
                                                <td className="px-4 py-3 text-right font-bold text-amber-500">{formatUang(rem)}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const renderUsageTable = () => {
                const uniqueGLs = []; const glMap = new Map();
                const uniqueUsageComps = []; const usageCompMap = new Set();
                
                activeTxns.forEach(t => {
                    if(!glMap.has(t.gl_code) && t.gl_code) { glMap.set(t.gl_code, t.gl_name); uniqueGLs.push({ code: t.gl_code, name: t.gl_name }); }
                    if(!usageCompMap.has(t.company) && t.company) { usageCompMap.add(t.company); uniqueUsageComps.push(t.company); }
                });

                const filtered = activeTxns.filter(t => 
                     (filterUsageGL === 'ALL' || t.gl_code === filterUsageGL) &&
                     (filterUsageComp === 'ALL' || t.company === filterUsageComp) &&
                     (searchUsageDesc === '' || (t.description && t.description.toLowerCase().includes(searchUsageDesc.toLowerCase())))
                );

                const handleSaveUsage = (e) => {
                    e.preventDefault();
                    if(usageForm.gl === '') return showToast("Pilih GL Code!", "error");
                    setIsSubmitting(true);
                    const amt = parseFloat(usageForm.amount) || 0; 
                    const glData = activeBudgets.find(b => b.gl_code === usageForm.gl);
                    const glNameFound = glData ? glData.gl_name : '';
                    const rate = data.rates[activeYear] || 15000; 

                    const payload = { 
                        id: 'U'+new Date().getTime(), date: usageForm.date, year: activeYear, 
                        company: usageForm.company, department: usageForm.dept, gl_code: usageForm.gl, gl_name: glNameFound,
                        type: 'usage_manual', amount_idr: currency === 'IDR' ? amt : amt * rate, 
                        amount_usd: currency === 'USD' ? amt : amt / rate, description: usageForm.desc, by: user.name 
                    };
                    
                    const optimisticTxns = [payload, ...data.transactions];
                    setData(prev => ({...prev, transactions: optimisticTxns}));

                    if (typeof google !== 'undefined' && google.script) {
                        google.script.run.withSuccessHandler(res=>{
                            setIsSubmitting(false);
                            if(res.success) { showToast("Usage Manual Disimpan!"); setUsageForm({...usageForm, amount:'', desc:''}); fetchData(true); } 
                            else { showToast(res.error, 'error'); fetchData(true); }
                        }).saveTransaction(payload);
                    } else if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        apiCall('saveTransaction', payload).then(res=>{
                            setIsSubmitting(false);
                            if(res.success) { showToast("Usage Manual Disimpan!"); setUsageForm({...usageForm, amount:'', desc:''}); fetchData(true); } 
                            else { showToast(res.error, 'error'); fetchData(true); }
                        }).catch(err => { setIsSubmitting(false); showToast(err.toString(), 'error'); });
                    } else {
                        setIsSubmitting(false); showToast("Demo Mode: Pengeluaran Tersimpan!"); setUsageForm({...usageForm, amount:'', desc:''});
                    }
                };

                const uniqueGLsForInput = []; const glMapInput = new Map();
                activeBudgets.filter(b=>b.department===usageForm.dept && b.company===usageForm.company).forEach(b => {
                    if(!glMapInput.has(b.gl_code)) { glMapInput.set(b.gl_code, b.gl_name); uniqueGLsForInput.push({ code: b.gl_code, name: b.gl_name }); }
                });

                return (
                    <div className="flex flex-col h-full gap-6 fade-in">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 shrink-0">
                            <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-2"><h3 className="font-bold text-slate-800">Input Manual Usage (Pengeluaran)</h3></div>
                            <form onSubmit={handleSaveUsage} className="space-y-4">
                                <div className="grid grid-cols-3 gap-4">
                                    <div><label className="block text-xs font-bold text-slate-500 mb-1">Tanggal</label><input type="date" required value={usageForm.date} onChange={e=>setUsageForm({...usageForm,date:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                                    <div><label className="block text-xs font-bold text-slate-500 mb-1">Company</label><select required value={usageForm.company} onChange={e=>setUsageForm({...usageForm,company:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm bg-slate-50"><option value="">- Pilih -</option>{data.companies.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                                    <div><label className="block text-xs font-bold text-slate-500 mb-1">Department</label><select required value={usageForm.dept} onChange={e=>setUsageForm({...usageForm,dept:e.target.value})} disabled={isUserLocked} className={`w-full border border-slate-300 rounded p-2 text-sm ${isUserLocked?'bg-slate-100':'bg-slate-50'}`}><option value="">- Pilih -</option>{data.departments.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
                                </div>
                                <div className="grid grid-cols-3 gap-4 items-end">
                                    <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">Pilih GL Code</label><select required value={usageForm.gl} onChange={e=>setUsageForm({...usageForm,gl:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm bg-slate-50 cursor-pointer"><option value="">- Filter Comp & Dept Dulu -</option>{uniqueGLsForInput.sort((a,b)=>a.code.localeCompare(b.code)).map(gl => <option key={gl.code} value={gl.code}>{gl.code} - {gl.name}</option>)}</select></div>
                                    <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">Amount ({currency})</label><input type="number" step="any" required value={usageForm.amount} onChange={e=>setUsageForm({...usageForm,amount:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm" placeholder="Contoh: 5000000"/></div>
                                    <div className="col-span-1"><button type="submit" disabled={isSubmitting} className="w-full bg-slate-800 text-white font-bold py-2 rounded shadow-sm hover:bg-slate-700">{isSubmitting ? 'Saving...' : 'Simpan Pengeluaran'}</button></div>
                                </div>
                                <div><label className="block text-xs font-bold text-slate-500 mb-1">Keterangan / Description</label><input type="text" required value={usageForm.desc} onChange={e=>setUsageForm({...usageForm,desc:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm" placeholder="Detail pengeluaran..."/></div>
                            </form>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                            <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                                <h3 className="font-bold text-slate-800 text-sm">Usage & Transactions Logs</h3>
                                <div className="flex space-x-2">
                                    <label className="cursor-pointer px-3 py-1 bg-white border border-slate-300 text-slate-700 rounded text-xs font-bold hover:bg-slate-50 flex items-center"><input type="file" className="hidden" accept=".csv" onChange={()=>showToast("Sistem Upload CSV sedang disiapkan", "warning")} /><span>📤 Upload CSV</span></label>
                                    <button onClick={() => { downloadCSV(filtered.map(r => ({ 'Date': r.date, 'Comp': r.company, 'Dept': r.department, 'GL Code': r.gl_code, 'GL Name': r.gl_name, 'Type': r.type, 'Description': r.description, 'Amount': currency === 'IDR' ? r.amount_idr : r.amount_usd })), "Usage_Logs"); }} className="px-3 py-1 bg-slate-800 text-white rounded text-xs font-bold hover:bg-slate-700">📥 Download CSV</button>
                                </div>
                            </div>
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full text-left text-xs whitespace-nowrap">
                                    <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase sticky top-0 shadow-sm z-10">
                                        <tr>
                                            <th className="px-4 py-3 align-top">Date</th>
                                            <th className="px-4 py-3 align-top"><div className="mb-1 text-[10px]">Filter Comp</div><select value={filterUsageComp} onChange={e=>setFilterUsageComp(e.target.value)} className="w-full border border-slate-300 rounded p-1 text-slate-800 font-normal outline-none focus:border-blue-500 max-w-[120px] cursor-pointer bg-slate-50"><option value="ALL">- All -</option>{uniqueUsageComps.sort().map(c => <option key={c} value={c}>{c}</option>)}</select></th>
                                            <th className="px-4 py-3 align-top">Dept</th>
                                            <th className="px-4 py-3 align-top"><div className="mb-1 text-[10px]">Filter GL Code</div><select value={filterUsageGL} onChange={e=>setFilterUsageGL(e.target.value)} className="w-full border border-slate-300 rounded p-1 text-slate-800 font-normal outline-none focus:border-blue-500 max-w-[200px] cursor-pointer bg-slate-50"><option value="ALL">- All GL Codes -</option>{uniqueGLs.sort((a,b)=>a.code.localeCompare(b.code)).map(gl => <option key={gl.code} value={gl.code}>{gl.code} - {gl.name}</option>)}</select></th>
                                            <th className="px-4 py-3 align-top">Source</th>
                                            <th className="px-4 py-3 align-top"><div className="mb-1 text-[10px]">Search Desc</div><input type="text" placeholder="Cari..." value={searchUsageDesc} onChange={(e) => setSearchUsageDesc(e.target.value)} className="w-full border border-slate-300 rounded p-1 text-slate-800 font-normal outline-none focus:border-blue-500 bg-slate-50" /></th>
                                            <th className="px-4 py-3 text-right align-top">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filtered.map((r, i) => {
                                            const typeLower = String(r.type).toLowerCase();
                                            return (
                                                <tr key={i} className="hover:bg-slate-50">
                                                    <td className="px-4 py-3 text-slate-500">{r.date}</td><td className="px-4 py-3 font-bold">{r.company}</td><td className="px-4 py-3">{r.department}</td>
                                                    <td className="px-4 py-3"><div className="font-bold text-blue-600">{r.gl_code}</div><div className="text-[10px] text-slate-500">{r.gl_name}</div></td>
                                                    <td className="px-4 py-3">{typeLower === 'supplement' ? <span className="px-2 py-0.5 rounded text-[9px] font-bold uppercase bg-emerald-100 text-emerald-700">Supplement</span> : typeLower === 'usage_manual' ? <span className="px-2 py-0.5 rounded text-[9px] font-bold uppercase bg-amber-100 text-amber-700">Manual Entry</span> : <span className="px-2 py-0.5 rounded text-[9px] font-bold uppercase bg-purple-100 text-purple-700">Finance Data</span>}</td>
                                                    <td className="px-4 py-3 whitespace-normal break-words max-w-[250px]">{r.description}</td>
                                                    <td className={`px-4 py-3 text-right font-bold ${typeLower==='supplement'?'text-emerald-600':'text-slate-700'}`}>{formatUang(currency === 'IDR' ? r.amount_idr : r.amount_usd)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderSupplementary = () => {
                const handleSaveSupp = (e) => {
                    e.preventDefault();
                    if(suppForm.gl === '') return showToast("Pilih GL Code!", "error");
                    setIsSubmitting(true);
                    const amt = parseFloat(suppForm.amount) || 0; 
                    const glData = activeBudgets.find(b => b.gl_code === suppForm.gl);
                    const glNameFound = glData ? glData.gl_name : '';
                    const rate = data.rates[activeYear] || 15000; 

                    const payload = { 
                        id: 'T'+new Date().getTime(), date: suppForm.date, year: activeYear, company: suppForm.company, department: suppForm.dept, gl_code: suppForm.gl, gl_name: glNameFound,
                        type: 'supplement', amount_idr: currency === 'IDR' ? amt : amt * rate, amount_usd: currency === 'USD' ? amt : amt / rate, description: suppForm.desc, by: user.name 
                    };
                    
                    const optimisticTxns = [payload, ...data.transactions];
                    setData(prev => ({...prev, transactions: optimisticTxns}));

                    if (typeof google !== 'undefined' && google.script) {
                        google.script.run.withSuccessHandler(res=>{
                            setIsSubmitting(false);
                            if(res.success) { showToast("Supplementary Disimpan!"); setSuppForm({...suppForm, amount:'', desc:''}); fetchData(true); } 
                            else { showToast(res.error, 'error'); fetchData(true); }
                        }).saveTransaction(payload);
                    } else if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        apiCall('saveTransaction', payload).then(res=>{
                            setIsSubmitting(false);
                            if(res.success) { showToast("Supplementary Disimpan!"); setSuppForm({...suppForm, amount:'', desc:''}); fetchData(true); } 
                            else { showToast(res.error, 'error'); fetchData(true); }
                        }).catch(err => { setIsSubmitting(false); showToast(err.toString(), 'error'); });
                    } else {
                        setIsSubmitting(false); showToast("Demo Mode: Supplementary Tersimpan!"); setSuppForm({...suppForm, amount:'', desc:''});
                    }
                };

                const uniqueGLs = []; const glMap = new Map();
                activeBudgets.filter(b=>b.department===suppForm.dept && b.company===suppForm.company).forEach(b => {
                    if(!glMap.has(b.gl_code)) { glMap.set(b.gl_code, b.gl_name); uniqueGLs.push({ code: b.gl_code, name: b.gl_name }); }
                });

                const suppLogs = activeTxns.filter(t => {
                    const isSupp = String(t.type).toLowerCase() === 'supplement';
                    const matchDesc = searchSuppDesc === '' || (t.description && t.description.toLowerCase().includes(searchSuppDesc.toLowerCase()));
                    return isSupp && matchDesc;
                });

                return (
                    <div className="flex flex-col h-full gap-6 fade-in">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 shrink-0">
                            <h3 className="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Input Supplementary Budget (Bisa Negatif/Minus)</h3>
                            <form onSubmit={handleSaveSupp} className="space-y-4">
                                <div className="grid grid-cols-3 gap-4">
                                    <div><label className="block text-xs font-bold text-slate-500 mb-1">Tanggal</label><input type="date" required value={suppForm.date} onChange={e=>setSuppForm({...suppForm,date:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                                    <div><label className="block text-xs font-bold text-slate-500 mb-1">Company</label><select required value={suppForm.company} onChange={e=>setSuppForm({...suppForm,company:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm bg-slate-50"><option value="">- Pilih -</option>{data.companies.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                                    <div><label className="block text-xs font-bold text-slate-500 mb-1">Department</label><select required value={suppForm.dept} onChange={e=>setSuppForm({...suppForm,dept:e.target.value})} disabled={isUserLocked} className={`w-full border border-slate-300 rounded p-2 text-sm ${isUserLocked?'bg-slate-100':'bg-slate-50'}`}><option value="">- Pilih -</option>{data.departments.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
                                </div>
                                <div className="grid grid-cols-3 gap-4 items-end">
                                    <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">Pilih GL Code</label><select required value={suppForm.gl} onChange={e=>setSuppForm({...suppForm,gl:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm bg-slate-50 cursor-pointer"><option value="">- Filter Comp & Dept Dulu -</option>{uniqueGLs.sort((a,b)=>a.code.localeCompare(b.code)).map(gl => <option key={gl.code} value={gl.code}>{gl.code} - {gl.name}</option>)}</select></div>
                                    <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">Amount ({currency})</label><input type="number" step="any" required value={suppForm.amount} onChange={e=>setSuppForm({...suppForm,amount:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm" placeholder="Bisa minus: -500000"/></div>
                                    <div className="col-span-1"><button type="submit" disabled={isSubmitting} className="w-full bg-blue-600 text-white font-bold py-2 rounded shadow-sm hover:bg-blue-700">{isSubmitting ? 'Saving...' : 'Simpan Supplementary'}</button></div>
                                </div>
                                <div><label className="block text-xs font-bold text-slate-500 mb-1">Keterangan / Description</label><input type="text" required value={suppForm.desc} onChange={e=>setSuppForm({...suppForm,desc:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                            </form>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                            <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-end">
                                <h3 className="font-bold text-slate-800 text-sm">Katalog Supplementary Aktif</h3>
                                <div className="flex space-x-2">
                                    <label className="cursor-pointer px-3 py-1 bg-white border border-slate-300 text-slate-700 rounded text-xs font-bold hover:bg-slate-50 flex items-center"><input type="file" className="hidden" accept=".csv" onChange={()=>showToast("Sistem Upload CSV sedang disiapkan", "warning")} /><span>📤 Upload CSV</span></label>
                                    <button onClick={() => { downloadCSV(suppLogs.map(r => ({ 'Date': r.date, 'Comp': r.company, 'Dept': r.department, 'GL Code': r.gl_code, 'GL Name': r.gl_name, 'Description': r.description, 'Amount': currency === 'IDR' ? r.amount_idr : r.amount_usd })), "Supplementary_Logs"); }} className="px-3 py-1 bg-slate-800 text-white rounded text-xs font-bold">📥 Download CSV</button>
                                </div>
                            </div>
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full text-left text-xs whitespace-nowrap">
                                    <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase sticky top-0 shadow-sm z-10">
                                        <tr>
                                            <th className="px-4 py-3 align-top">Date</th><th className="px-4 py-3 align-top">Comp</th><th className="px-4 py-3 align-top">Dept</th><th className="px-4 py-3 align-top">GL Code & Name</th>
                                            <th className="px-4 py-3 align-top"><div className="mb-1 text-[10px]">Search Desc</div><input type="text" placeholder="Cari..." value={searchSuppDesc} onChange={(e) => setSearchSuppDesc(e.target.value)} className="w-full border border-slate-300 rounded p-1 text-slate-800 font-normal outline-none focus:border-blue-500 bg-slate-50" /></th>
                                            <th className="px-4 py-3 text-right align-top">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {suppLogs.map((t, i) => (
                                            <tr key={i} className="hover:bg-slate-50">
                                                <td className="px-4 py-3 text-slate-500">{t.date}</td><td className="px-4 py-3 font-bold">{t.company}</td><td className="px-4 py-3">{t.department}</td>
                                                <td className="px-4 py-3"><span className="font-bold text-blue-600">{t.gl_code}</span><br/><span className="text-[10px] text-slate-500">{t.gl_name}</span></td>
                                                <td className="px-4 py-3 whitespace-normal break-words max-w-[250px]">{t.description}</td>
                                                <td className="px-4 py-3 text-right font-bold text-emerald-600">{formatUang(currency === 'IDR' ? t.amount_idr : t.amount_usd)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderPlanning = () => {
                const nextYear = String(parseInt(activeYear) + 1);
                const planMap = {};
                
                activeBudgets.forEach(b => {
                    const key = `${b.company}-${b.gl_code}`;
                    if(!planMap[key]) planMap[key] = { comp: b.company, dept: b.department, code: b.gl_code, name: b.gl_name, b_curr: 0, u_curr: 0, p_next: 0 };
                    planMap[key].b_curr += (currency === 'IDR' ? safeNum(b.amount_idr) : safeNum(b.amount_usd));
                });

                activeTxns.forEach(t => {
                    const key = `${t.company}-${t.gl_code}`;
                    if(planMap[key] && String(t.type).toLowerCase() !== 'supplement') planMap[key].u_curr += (currency === 'IDR' ? safeNum(t.amount_idr) : safeNum(t.amount_usd));
                });

                (data.budgets || []).forEach(b => {
                    if(String(b.year).trim() === nextYear && String(b.status).trim().toLowerCase() === 'draft' && (subDept === 'All Area HCGS' || String(b.department).trim() === subDept) && (activeCompany === 'All' || String(b.company).trim() === activeCompany)) {
                        const key = `${b.company}-${b.gl_code}`;
                        const amt = (currency === 'IDR' ? safeNum(b.amount_idr) : safeNum(b.amount_usd));
                        if(planMap[key]) planMap[key].p_next += amt;
                        else planMap[key] = { comp: b.company, dept: b.department, code: b.gl_code, name: b.gl_name, b_curr: 0, u_curr: 0, p_next: amt };
                    }
                });

                const planningRows = Object.values(planMap);

                const handleSaveDraft = (row) => {
                    if(draftInput === '') return;
                    setIsSubmitting(true);
                    const amt = parseFloat(draftInput) || 0;
                    const rate = data.rates[nextYear] || 15000;
                    
                    const payload = {
                        year: nextYear, company: row.comp, department: row.dept, gl_code: row.code, gl_name: row.name,
                        amount_idr: currency === 'IDR' ? amt : amt * rate, amount_usd: currency === 'USD' ? amt : amt / rate
                    };

                    if (typeof google !== 'undefined' && google.script) {
                        google.script.run.withSuccessHandler(res=>{
                            setIsSubmitting(false); setEditingDraft(null);
                            if(res.success) { showToast("Draft Tersimpan!"); fetchData(true); } else { showToast(res.error, 'error'); }
                        }).saveDraftBudget(payload);
                    } else if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        apiCall('saveDraftBudget', payload).then(res=>{
                            setIsSubmitting(false); setEditingDraft(null);
                            if(res.success) { showToast("Draft Tersimpan!"); fetchData(true); } else { showToast(res.error, 'error'); }
                        }).catch(err => { setIsSubmitting(false); showToast(err.toString(), 'error'); });
                    } else {
                        setIsSubmitting(false); setEditingDraft(null); showToast("Demo Mode: Draft Tersimpan!");
                        const newDraft = { ...payload, id: 'D'+new Date().getTime(), status: 'Draft' };
                        const newBudgets = [...data.budgets.filter(b => !(b.year === payload.year && b.company === payload.company && b.department === payload.department && b.gl_code === payload.gl_code)), newDraft];
                        setData(prev => ({...prev, budgets: newBudgets}));
                    }
                };

                return (
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden fade-in flex flex-col h-full relative">
                        {detailModal && (
                            <div className="absolute inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-6 fade-in backdrop-blur-sm">
                                <div className="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden">
                                    <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-[#0f172a] text-white">
                                        <div><h3 className="font-bold text-lg">Detail Breakdown (FY{activeYear})</h3><p className="text-xs text-blue-300 font-medium">[{detailModal.comp}] GL: {detailModal.code} - {detailModal.name}</p></div>
                                        <button onClick={()=>setDetailModal(null)} className="text-white hover:text-red-400 font-bold px-3 py-1 text-xl">&times;</button>
                                    </div>
                                    <div className="flex-1 flex overflow-hidden">
                                        <div className="w-1/2 flex flex-col border-r border-slate-200">
                                            <div className="p-3 bg-slate-100 border-b border-slate-200 font-bold text-xs text-slate-700 text-center">INITIAL BUDGET DETAILS</div>
                                            <div className="flex-1 overflow-auto p-4">
                                                <table className="w-full text-left text-xs">
                                                    <thead className="text-slate-400 border-b border-slate-200"><tr><th className="pb-2">Description</th><th className="pb-2 text-right">Amount</th></tr></thead>
                                                    <tbody>
                                                        {activeBudgets.filter(b => b.gl_code === detailModal.code && b.company === detailModal.comp).map((b,i) => (
                                                            <tr key={i} className="border-b border-slate-100 hover:bg-slate-50"><td className="py-2">{b.description || '-'}</td><td className="py-2 text-right font-bold">{formatUang(currency === 'IDR' ? b.amount_idr : b.amount_usd)}</td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                        <div className="w-1/2 flex flex-col">
                                            <div className="p-3 bg-slate-100 border-b border-slate-200 font-bold text-xs text-slate-700 text-center">USAGE TRANSACTIONS</div>
                                            <div className="flex-1 overflow-auto p-4">
                                                <table className="w-full text-left text-xs">
                                                    <thead className="text-slate-400 border-b border-slate-200"><tr><th className="pb-2">Date</th><th className="pb-2">Desc</th><th className="pb-2 text-right">Amount</th></tr></thead>
                                                    <tbody>
                                                        {activeTxns.filter(t => t.gl_code === detailModal.code && t.company === detailModal.comp && String(t.type).toLowerCase() !== 'supplement').map((t,i) => (
                                                            <tr key={i} className="border-b border-slate-100 hover:bg-slate-50"><td className="py-2 text-slate-400">{t.date}</td><td className="py-2 truncate max-w-[120px]" title={t.description}>{t.description}</td><td className="py-2 text-right font-bold text-purple-700">{formatUang(currency === 'IDR' ? t.amount_idr : t.amount_usd)}</td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        <div className="p-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                            <div><h3 className="font-bold text-slate-800">FY {nextYear} Budget Submission Dashboard</h3><p className="text-xs text-slate-500 mt-1">Interactive Inline Editing Enabled. Click cells to edit Proposed Budget.</p></div>
                            <div className="flex space-x-2">
                                <label className="cursor-pointer px-3 py-1.5 bg-white border border-slate-300 text-slate-700 rounded text-sm font-bold hover:bg-slate-50 flex items-center"><input type="file" className="hidden" accept=".csv" onChange={()=>showToast("Sistem Upload CSV sedang disiapkan", "warning")} /><span>📤 Upload CSV</span></label>
                                <button onClick={() => { downloadCSV(planningRows.map(r => ({ 'Comp': r.comp, 'Dept': r.dept, 'GL Code': r.code, 'GL Name': r.name, [`FY${activeYear} Budget`]: r.b_curr, [`FY${activeYear} Usage`]: r.u_curr, [`Proposed FY${parseInt(activeYear) + 1}`]: r.p_next })), "Budget_Proposal"); }} className="px-4 py-1.5 bg-blue-600 text-white text-sm font-bold rounded shadow-sm hover:bg-blue-700">📥 Download CSV</button>
                            </div>
                        </div>
                        <div className="overflow-x-auto flex-1">
                            <table className="w-full text-left text-xs whitespace-nowrap">
                                <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase sticky top-0 shadow-sm z-10">
                                    <tr><th className="px-4 py-3">Comp</th><th className="px-4 py-3">Dept</th><th className="px-4 py-3">GL Code & Name</th><th className="px-4 py-3 text-right">FY{activeYear} Budget</th><th className="px-4 py-3 text-right">FY{activeYear} Usage</th><th className="px-4 py-3 text-right bg-blue-50 text-blue-700 font-bold border-l border-blue-200">Proposed FY{nextYear}</th><th className="px-4 py-3 text-center">Action</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {planningRows.map((r, i) => (
                                        <tr key={i} className="hover:bg-slate-50">
                                            <td className="px-4 py-3 font-bold">{r.comp}</td><td className="px-4 py-3">{r.dept}</td>
                                            <td className="px-4 py-3"><div className="font-bold text-slate-800">{r.code}</div><div className="text-[10px] text-slate-500">{r.name}</div></td>
                                            <td className="px-4 py-3 text-right text-slate-500 font-medium">{formatUang(r.b_curr)}</td>
                                            <td className="px-4 py-3 text-right font-medium text-purple-700">{formatUang(r.u_curr)}</td>
                                            
                                            <td className="px-4 py-2 text-right bg-blue-50/30 border-l border-blue-100 group transition-colors">
                                                {editingDraft === `${r.comp}-${r.code}` ? (
                                                    <div className="flex flex-col items-end space-y-1">
                                                        <input type="number" autoFocus className="w-32 p-1 border-b-2 border-blue-500 bg-white text-right font-bold text-blue-800 outline-none shadow-sm rounded-sm" value={draftInput} onChange={(e) => setDraftInput(e.target.value)} placeholder="Amount..." />
                                                        <div className="flex space-x-1">
                                                            <button onClick={() => setEditingDraft(null)} className="text-[9px] px-2 py-0.5 bg-slate-200 text-slate-600 rounded">Cancel</button>
                                                            <button onClick={() => handleSaveDraft(r)} className="text-[9px] px-2 py-0.5 bg-blue-600 text-white font-bold rounded shadow-sm hover:bg-blue-700">{isSubmitting ? '...' : 'Save'}</button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="cursor-pointer p-2 rounded hover:bg-blue-100/50 flex flex-col items-end justify-center h-full" onClick={() => { setEditingDraft(`${r.comp}-${r.code}`); setDraftInput(r.p_next > 0 ? r.p_next : ''); }} title="Click to Input/Edit Draft">
                                                        <div className={`font-bold ${r.p_next > 0 ? 'text-blue-700 text-sm' : 'text-slate-400 text-xs italic'}`}>{r.p_next > 0 ? formatUang(r.p_next) : 'Klik u/ Input Draft'}</div>
                                                    </div>
                                                )}
                                            </td>
                                            <td className="px-4 py-3 text-center"><button onClick={()=>setDetailModal(r)} className="px-4 py-1 bg-slate-800 text-white rounded font-bold hover:bg-slate-700 shadow-sm text-[10px]">Detail</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const renderReports = () => {
                const nextYear = String(parseInt(activeYear) + 1);
                const repBudgets = activeBudgets;
                const repDrafts = (data.budgets || []).filter(b => String(b.year).trim() === nextYear && String(b.status).trim().toLowerCase() === 'draft' && (subDept === 'All Area HCGS' || String(b.department).trim() === subDept) && (activeCompany === 'All' || String(b.company).trim() === activeCompany));
                
                const glMap = new Map();
                const getOrCreateGL = (code, name, dept) => {
                    const key = `${dept}-${code}`;
                    if(!glMap.has(key)) glMap.set(key, { dept, code, name, b_curr: 0, p_next: 0 });
                    return glMap.get(key);
                };

                repBudgets.forEach(b => { getOrCreateGL(b.gl_code, b.gl_name, b.department).b_curr += currency === 'IDR' ? safeNum(b.amount_idr) : safeNum(b.amount_usd); });
                repDrafts.forEach(b => { getOrCreateGL(b.gl_code, b.gl_name, b.department).p_next += currency === 'IDR' ? safeNum(b.amount_idr) : safeNum(b.amount_usd); });

                const consolidatedData = Array.from(glMap.values()).map(item => {
                    const diffVal = item.p_next - item.b_curr;
                    const diffPct = item.b_curr > 0 ? (diffVal / item.b_curr) * 100 : (item.p_next > 0 ? 100 : 0);
                    return { ...item, diffVal, diffPct };
                });

                const topIncrements = [...consolidatedData].filter(i => i.diffVal > 0).sort((a,b) => b.diffVal - a.diffVal).slice(0, 5);
                const topSavings = [...consolidatedData].filter(i => i.diffVal < 0 && i.p_next > 0).sort((a,b) => a.diffVal - b.diffVal).slice(0, 5);
                const deletedBudgets = [...consolidatedData].filter(i => i.b_curr > 0 && i.p_next === 0).sort((a,b) => b.b_curr - a.b_curr);

                const deptSummary = {};
                consolidatedData.forEach(r => {
                    if(!deptSummary[r.dept]) deptSummary[r.dept] = { dept: r.dept, b_curr: 0, p_next: 0 };
                    deptSummary[r.dept].b_curr += r.b_curr;
                    deptSummary[r.dept].p_next += r.p_next;
                });
                const chartData = Object.values(deptSummary).map(d => ({ name: d.dept, Budget26: d.b_curr, Proposed27: d.p_next }));

                const VarianceTable = ({ title, data, type }) => (
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mt-6">
                        <div className={`p-4 border-b border-slate-200 flex items-center justify-between ${type === 'inc' ? 'bg-amber-50' : type === 'sav' ? 'bg-emerald-50' : 'bg-red-50'}`}><h3 className={`font-bold text-sm ${type === 'inc' ? 'text-amber-800' : type === 'sav' ? 'text-emerald-800' : 'text-red-800'}`}>{title}</h3></div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs whitespace-nowrap">
                                <thead className="bg-white text-slate-500 uppercase border-b border-slate-100">
                                    <tr><th className="px-4 py-3">Dept</th><th className="px-4 py-3">GL Category</th><th className="px-4 py-3 text-right">FY{activeYear}</th><th className="px-4 py-3 text-right">Proposed FY{nextYear}</th><th className="px-4 py-3 text-right">Variance</th><th className="px-4 py-3 text-center">%</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {data.length === 0 ? <tr><td colSpan="6" className="px-4 py-6 text-center text-slate-400 italic">No significant variances found in this category.</td></tr> : data.map((r, i) => (
                                        <tr key={i} className="hover:bg-slate-50">
                                            <td className="px-4 py-3 font-semibold text-slate-500">{r.dept}</td>
                                            <td className="px-4 py-3"><div className="font-bold text-slate-700">{r.code}</div><div className="text-[9px] text-slate-500 max-w-[200px] truncate" title={r.name}>{r.name}</div></td>
                                            <td className="px-4 py-3 text-right text-slate-500">{formatUang(r.b_curr)}</td><td className="px-4 py-3 text-right font-bold text-[#0f172a]">{formatUang(r.p_next)}</td>
                                            <td className={`px-4 py-3 text-right font-bold ${r.diffVal > 0 ? 'text-amber-600':'text-emerald-600'}`}>{r.diffVal > 0 ? '+':''}{formatUang(r.diffVal)}</td>
                                            <td className="px-4 py-3 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${r.diffPct > 0 ? 'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700'}`}>{r.diffPct > 0 ? '+':''}{r.diffPct.toFixed(0)}%</span></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );

                return (
                    <div className="space-y-6 fade-in h-full overflow-y-auto pb-10 relative">
                        <div className="bg-[#0f172a] p-6 rounded-2xl flex justify-between items-center text-white shadow-lg">
                            <div><h2 className="text-xl font-bold">Strategic Executive Summary FY{nextYear}</h2><p className="text-xs text-blue-300 mt-1">Focusing on material variances and strategic impact analysis.</p></div>
                            <div className="flex items-center space-x-2 bg-slate-800 p-2 rounded-lg border border-slate-700">
                                <span className="text-[10px] text-slate-400 uppercase font-bold pl-2">Entity View:</span>
                                <span className="text-white text-xs font-bold pr-2">{activeCompany === 'All' ? 'Consolidated (All)' : activeCompany}</span>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col h-80">
                             <h3 className="font-bold text-slate-800 mb-4 text-center">Budget Transition Outlook: FY{activeYear} vs FY{nextYear}</h3>
                             <ResponsiveContainer width="100%" height="100%">
                                 <BarChart data={chartData} margin={{top: 10, right: 30, left: 20, bottom: 20}}>
                                     <CartesianGrid strokeDasharray="3 3" vertical={false}/>
                                     <XAxis dataKey="name" tick={{fontSize: 10}} angle={-15} textAnchor="end"/>
                                     <YAxis tickFormatter={formatShort} tick={{fontSize: 10}}/>
                                     <RechartsTooltip formatter={(val) => formatUang(val)} />
                                     <Legend wrapperStyle={{fontSize: '11px'}} />
                                     <Bar dataKey="Budget26" name={`Initial Budget FY${activeYear}`} fill="#94a3b8" radius={[4,4,0,0]} />
                                     <Bar dataKey="Proposed27" name={`Proposed Budget FY${nextYear}`} fill="#1d4ed8" radius={[4,4,0,0]} />
                                 </BarChart>
                             </ResponsiveContainer>
                        </div>
                        
                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                            <VarianceTable title={`Top 5 Cost Increments (Highest Strategic Impact)`} data={topIncrements} type="inc" />
                            <div className="flex flex-col gap-6">
                                <VarianceTable title={`Top Cost Savings Identified`} data={topSavings} type="sav" />
                                <VarianceTable title={`Budget Eliminations (Zeroed out for FY${nextYear})`} data={deletedBudgets} type="del" />
                            </div>
                        </div>
                    </div>
                );
            };

            const renderAdmin = () => {
                const handleSaveMaster = (e) => {
                    e.preventDefault(); setIsSubmitting(true);
                    
                    if (typeof google !== 'undefined' && google.script) {
                        google.script.run.withSuccessHandler(r=>{
                            setIsSubmitting(false); if(r.success){ showToast("Master Data Disimpan!"); fetchData(true); setAdminForm({...adminForm, value:''}); } else showToast(r.error, 'error');
                        }).saveMasterData(adminForm.type, adminForm.value);
                    } else if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        apiCall('saveMasterData', { type: adminForm.type, value: adminForm.value }).then(r=>{
                            setIsSubmitting(false); if(r.success){ showToast("Master Data Disimpan!"); fetchData(true); setAdminForm({...adminForm, value:''}); } else showToast(r.error, 'error');
                        }).catch(err => { setIsSubmitting(false); showToast(err.toString(), 'error'); });
                    } else {
                        setIsSubmitting(false); showToast("Demo Mode: Data Master Tersimpan!");
                        if(adminForm.type === 'Company') setData(p => ({...p, companies: [...p.companies, adminForm.value]}));
                        if(adminForm.type === 'Department') setData(p => ({...p, departments: [...p.departments, adminForm.value]}));
                        setAdminForm({...adminForm, value:''});
                    }
                };

                const handleSaveUser = (e) => {
                    e.preventDefault(); setIsSubmitting(true);
                    
                    if (typeof google !== 'undefined' && google.script) {
                        google.script.run.withSuccessHandler(r=>{
                            setIsSubmitting(false); if(r.success){ showToast("User Dibuat!"); fetchData(true); setUserForm({username:'', password:'', name:'', role:'User', dept:'', comp:'', email:''}); } else showToast(r.error, 'error');
                        }).saveUser(userForm);
                    } else if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.startsWith('http')) {
                        apiCall('saveUser', userForm).then(r=>{
                            setIsSubmitting(false); if(r.success){ showToast("User Dibuat!"); fetchData(true); setUserForm({username:'', password:'', name:'', role:'User', dept:'', comp:'', email:''}); } else showToast(r.error, 'error');
                        }).catch(err => { setIsSubmitting(false); showToast(err.toString(), 'error'); });
                    } else {
                        setIsSubmitting(false); showToast("Demo Mode: User Dibuat!");
                        setData(p => ({...p, users: [...p.users, {id: 'U'+Date.now(), ...userForm}]}));
                        setUserForm({username:'', password:'', name:'', role:'User', dept:'', comp:'', email:''});
                    }
                };

                return (
                    <div className="space-y-6 fade-in h-full flex gap-6">
                        <div className="w-1/2 space-y-6 flex flex-col">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Katalog Master Data</h3>
                                <form onSubmit={handleSaveMaster} className="flex gap-4 items-end mb-6">
                                    <div className="flex-1"><label className="block text-xs font-bold text-slate-500 mb-1">Tipe Data</label><select value={adminForm.type} onChange={e=>setAdminForm({...adminForm, type:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"><option value="Company">Company</option><option value="Department">Department</option></select></div>
                                    <div className="flex-[2]"><label className="block text-xs font-bold text-slate-500 mb-1">Nilai Baru</label><input required type="text" value={adminForm.value} onChange={e=>setAdminForm({...adminForm, value:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                                    <button type="submit" disabled={isSubmitting} className="bg-slate-800 text-white font-bold px-4 py-2 rounded">Add</button>
                                </form>
                                <div className="flex gap-4">
                                    <div className="flex-1 bg-slate-50 rounded border border-slate-200 p-2 h-48 overflow-auto"><div className="text-[10px] font-bold text-slate-400 mb-2">COMPANIES</div>{(data.companies||[]).map((c,i) => <div key={i} className="text-xs text-slate-700 font-semibold mb-1">{c}</div>)}</div>
                                    <div className="flex-[2] bg-slate-50 rounded border border-slate-200 p-2 h-48 overflow-auto"><div className="text-[10px] font-bold text-slate-400 mb-2">DEPARTMENTS</div>{(data.departments||[]).map((d,i) => <div key={i} className="text-xs text-slate-700 font-semibold mb-1">{d}</div>)}</div>
                                </div>
                            </div>
                        </div>

                        <div className="w-1/2 space-y-6 flex flex-col">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex-1">
                                <h3 className="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">User Management</h3>
                                <form onSubmit={handleSaveUser} className="space-y-3 mb-6">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><input type="text" required placeholder="Name Lengkap" value={userForm.name} onChange={e=>setUserForm({...userForm, name:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                                        <div><select required value={userForm.role} onChange={e=>setUserForm({...userForm, role:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"><option value="Admin">Admin</option><option value="User">User</option></select></div>
                                        <div><input type="text" required placeholder="Username Baru" value={userForm.username} onChange={e=>setUserForm({...userForm, username:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                                        <div><input type="password" required placeholder="Password" value={userForm.password} onChange={e=>setUserForm({...userForm, password:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                                        <div className="col-span-2"><input type="email" placeholder="Email untuk Alert (Opsional)" value={userForm.email} onChange={e=>setUserForm({...userForm, email:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"/></div>
                                        <div><select required value={userForm.comp} onChange={e=>setUserForm({...userForm, comp:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"><option value="">- Company Akses -</option><option value="All">All</option>{(data.companies||[]).map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                                        <div><select required value={userForm.dept} onChange={e=>setUserForm({...userForm, dept:e.target.value})} className="w-full border border-slate-300 rounded p-2 text-sm"><option value="">- Dept Akses -</option><option value="All Area HCGS">All Area HCGS</option>{(data.departments||[]).map(d=><option key={d} value={d}>{d}</option>)}</select></div>
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-blue-600 text-white font-bold py-2 rounded shadow-sm hover:bg-blue-700">Buat User Baru</button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen w-full bg-slate-50 overflow-hidden font-sans">
                    {toast && (<div className={`fixed top-6 right-6 px-6 py-4 rounded-xl shadow-2xl z-50 flex items-center space-x-3 text-white toast-enter ${toast.type==='success'?'bg-emerald-600':'bg-red-600'}`}><span className="font-bold text-sm">{toast.msg}</span></div>)}
                    
                    <div className="w-64 bg-gradient-to-b from-white to-blue-50 border-r border-slate-200 flex flex-col shrink-0 z-20 h-screen shadow-lg">
                    <div className="p-6 flex flex-col items-center border-b border-slate-200 bg-white/50"><img src={data.logoUrl || "https://i.ibb.co.com/d4J7SpwB/logo-tranparant-BP-tulisan.png"} alt="BudgetPro" className="h-16 object-contain mb-3 drop-shadow-sm" /><span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-white px-3 py-1 rounded-full border border-slate-200">Enterprise Edition</span></div>
                    <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                            {[
                                { id: 'dashboard', label: 'Dashboard Analytics' },
                                { id: 'budget', label: 'Budget Confirm' },
                                { id: 'usage', label: 'Usage / Transactions' },
                                { id: 'supplement', label: 'Supplementary Entry' },
                                { id: 'planning', label: 'Next Year Submission' },
                                { id: 'reports', label: 'Management Reports' }
                            ].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full text-left px-4 py-3 rounded-xl transition-all text-sm font-semibold border ${activeTab === item.id ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'text-slate-600 border-transparent hover:bg-white'}`}>{item.label}</button>
                            ))}
                            {isAdmin && (
                                <div className="mt-6 pt-4 border-t border-slate-200">
                                    <p className="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Admin Panel</p>
                                    <button onClick={() => setActiveTab('admin')} className={`w-full text-left px-4 py-3 rounded-xl transition-all text-sm font-semibold border ${activeTab === 'admin' ? 'bg-slate-800 text-white border-slate-700 shadow-md' : 'text-slate-500 border-transparent hover:bg-slate-200'}`}>Master Data Settings</button>
                                </div>
                            )}
                        </nav>
                        <div className="p-4 border-t border-slate-200 bg-white flex items-center justify-between"><div className="flex items-center space-x-3"><div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">{user.name.charAt(0)}</div><div className="flex flex-col text-left max-w-[120px]"><span className="text-sm font-bold text-slate-800 truncate">{user.name}</span><span className="text-[10px] font-semibold text-slate-500 truncate">{user.role}</span></div></div><button onClick={() => {setUser(null);setLoginInput({user:'',pass:''});}} className="text-red-500 font-bold text-xl">🚪</button></div>
                    </div>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center shrink-0 z-10 shadow-sm relative">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800 capitalize">{String(activeTab).replace('-', ' ')}</h1>
                                <div className="flex items-center space-x-3 mt-2 text-sm">
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Tahun:</span><select value={activeYear} onChange={(e)=>setActiveYear(e.target.value)} className="bg-blue-50 text-blue-700 border border-blue-200 font-bold text-sm px-2 py-1 rounded-md outline-none"><option value="2026">FY 2026</option></select>
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider ml-2">Comp:</span>
                                    <select value={activeCompany} onChange={(e)=>setActiveCompany(e.target.value)} disabled={isCompLocked} className={`bg-slate-50 border border-slate-200 text-slate-700 font-bold text-sm px-2 py-1 rounded-md max-w-[120px] truncate outline-none ${isCompLocked ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}`}>
                                        <option value="All">All Entities</option>
                                        {data.companies.map(c=><option key={c} value={c}>{c}</option>)}
                                    </select>
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider ml-2">Dept:</span>
                                    <select value={subDept} onChange={(e)=>setSubDept(e.target.value)} disabled={isUserLocked} className={`bg-slate-50 border border-slate-200 text-slate-700 font-bold text-sm px-2 py-1 rounded-md max-w-xs truncate outline-none ${isUserLocked ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}`}>
                                        <option value="All Area HCGS">All Area HCGS</option>
                                        {data.departments.map(d=><option key={d} value={d}>{d}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                {isSyncing && (
                                    <div className="text-xs font-bold text-blue-600 flex items-center bg-blue-50 px-3 py-1.5 rounded-full border border-blue-100">
                                        <svg className="animate-spin -ml-1 mr-2 h-3.5 w-3.5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                        Syncing...
                                    </div>
                                )}
                                <div className="flex bg-slate-100 p-1.5 rounded-lg border border-slate-200 shadow-inner">
                                    <button onClick={()=>setCurrency('IDR')} className={`px-5 py-1.5 text-xs font-bold rounded-md ${currency==='IDR'?'bg-white text-blue-700 shadow-sm':'text-slate-500'}`}>IDR</button>
                                    <button onClick={()=>setCurrency('USD')} className={`px-5 py-1.5 text-xs font-bold rounded-md ${currency==='USD'?'bg-white text-blue-700 shadow-sm':'text-slate-500'}`}>USD</button>
                                </div>
                            </div>
                        </header>
                        
                        <main className="flex-1 overflow-y-auto p-8 w-full bg-slate-50">
                            <div className="w-full h-full max-w-[1600px] mx-auto">
                                <ContentErrorBoundary activeTab={activeTab}>
                                    {activeTab === 'dashboard' && renderDashboard()}
                                    {activeTab === 'budget' && renderBudgetTable()}
                                    {activeTab === 'usage' && renderUsageTable()}
                                    {activeTab === 'supplement' && renderSupplementary()}
                                    {activeTab === 'planning' && renderPlanning()}
                                    {activeTab === 'reports' && renderReports()}
                                    {activeTab === 'admin' && renderAdmin()}
                                </ContentErrorBoundary>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
